<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>映射设置</title>
<style>body{max-width:820px;margin:40px auto;padding:0 24px;background:#101923;color:#dae7f0;font:16px system-ui}p{color:#a3b6c8;line-height:1.7}label{display:block;margin:16px 0}input[type=number]{padding:10px;margin-left:12px;width:130px}button{padding:12px 24px;background:#91edce;border:0;border-radius:8px}#preview{width:100%;height:260px;background:#233342;position:relative;overflow:hidden;border:1px solid #547086}#area{position:absolute;border:2px solid #91edce;background:#91edce22;cursor:move;touch-action:none}#handle{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;background:#91edce;cursor:nwse-resize;touch-action:none}pre{white-space:pre-wrap;color:#a3b6c8}</style>
<h1>Mac 映射高级设置</h1><p>日常使用请点菜单栏的笔尖图标，在桌面上直接调整置顶映射框，并点“完成调整”。此页用于查看输入数据和精确设置数值。坐标原点在主屏幕左上，平板连接后同步输入区比例。</p>
<div id="preview"><div id="area"><div id="handle"></div></div></div>
<form id="form"><label>左边 x<input id="x" type="number" required step="any"></label><label>顶部 y<input id="y" type="number" required step="any"></label><label>宽度<input id="width" type="number" min="1" required step="any"></label><p id="height"></p><label><input id="pen" type="checkbox"> 附加笔压和倾斜字段（关闭可退回普通鼠标兼容模式）</label><button>保存映射</button><span id="message"></span></form><pre id="status"></pre>
<script>
let state,editing=false;const fields=['x','y','width'],el=id=>document.getElementById(id);
function draw(){if(!state)return;const s=state.screen,c=Object.fromEntries(fields.map(k=>[k,Number(el(k).value)])),scale=el('preview').clientWidth/s.width;el('preview').style.height=s.height*scale+'px';Object.assign(el('area').style,{left:(c.x-s.x)*scale+'px',top:(c.y-s.y)*scale+'px',width:c.width*scale+'px',height:c.width/state.config.ratio*scale+'px'});el('height').textContent=`高度 ${(c.width/state.config.ratio).toFixed(1)} · 输入区比例 ${state.config.ratio.toFixed(4)}`}
async function refresh(){try{const r=await fetch('/api/status');state=await r.json();if(!editing){for(const k of fields)el(k).value=state.config[k];el('pen').checked=state.config.pen}draw();el('status').textContent=JSON.stringify({模式:state.dryRun?'仅接收，不控制鼠标':'真实输入',平板已连接:state.connected,事件数:state.count,最近事件:state.last},null,2)}catch(e){el('message').textContent='服务连接中断'}}
el('form').oninput=()=>{editing=true;draw()};
el('form').onsubmit=async e=>{e.preventDefault();try{const body=Object.fromEntries(fields.map(k=>[k,Number(el(k).value)]));body.pen=el('pen').checked;const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error);editing=false;el('message').textContent=' 已保存';refresh()}catch(e){el('message').textContent=e.message}};
el('area').onpointerdown=e=>{e.preventDefault();editing=true;const scale=el('preview').clientWidth/state.screen.width,start={px:e.clientX,py:e.clientY,x:+el('x').value,y:+el('y').value,w:+el('width').value},resize=e.target===el('handle');el('area').setPointerCapture(e.pointerId);el('area').onpointermove=m=>{if(resize)el('width').value=Math.max(1,start.w+(m.clientX-start.px)/scale).toFixed(1);else{el('x').value=(start.x+(m.clientX-start.px)/scale).toFixed(1);el('y').value=(start.y+(m.clientY-start.py)/scale).toFixed(1)}draw()}};
el('area').onpointerup=el('area').onpointercancel=()=>el('area').onpointermove=null;
window.onresize=draw;refresh();setInterval(refresh,500);
</script></html>
